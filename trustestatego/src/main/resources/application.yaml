paypal:
  client:
    id: ${PAYPAL_ID}
    secret: ${PAYPAL_SECRET}
  mode: sandbox
  successUrl: https://trustestatego-frontend.onrender.com/payment-success
  cancelUrl: https://trustestatego-frontend.onrender.com/payment-cancel
  currency: USD