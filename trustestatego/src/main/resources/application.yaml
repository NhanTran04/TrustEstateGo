server:
  port: 8080
  servlet:
    context-path: /trustestatego

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB
      max-request-size: 400MB
      file-size-threshold: 10MB
      resolve-lazily: false
  datasource:
    url: "jdbc:mysql://localhost:3306/trust_estate_go"
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    web:
      pageable:
        default-page-size: 5        # số record mặc định mỗi trang
        one-indexed-parameters: true  # page=1 sẽ là trang đầu (mặc định Spring là page=0)
  elasticsearch:
    uris: http://localhost:9200
